       ▼
uiapi
       │
       ▼
"Use Salesforce UI API"
       │
       ▼
query
       │
       ▼
"I want to query Salesforce records"
       │
       ▼
Account(first:5)
       │
       ▼
"Give me the first 5 Account records"
       │
       ▼
edges
       │
       ▼
Result Collection
 ├── Edge 1
 ├── Edge 2
 ├── Edge 3
 ├── Edge 4
 └── Edge 5
       │
       ▼
node
       │
       ▼
Actual Salesforce Record
       │
       ├── Id
       │
       └── Name
             │
             └── value


