<template>
    <lightning-card title="Account Explorer">
        
       <template if:true = {accounts}>
        <lightning-datatable 
            key-field = "id"
            data = {accounts}
            columns = {columns}>
        </lightning-datatable>
       </template>

        <template if:true={error}>
            <div>Something went wrong</div>
        </template>
    </lightning-card>
</template>
