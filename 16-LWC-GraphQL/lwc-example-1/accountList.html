<template>
    <lightning-card title="Accounts">

        <template if:true={accounts}>

            <template for:each={accounts} for:item="account">

                <div key={account.Id} class="slds-p-around_small">

                    <strong>{account.Name.value}</strong>

                    <br/>

                    {account.Industry.value}

                </div>

            </template>

        </template>

        <template if:true={errors}>

            <p class="slds-text-color_error">

                Error loading accounts.

            </p>

        </template>

    </lightning-card>
</template>
