# ===================================================
# GraphQL Arguments Examples
# ===================================================

# ---------------------------------------------------
# 1. Simple Argument
# ---------------------------------------------------

query {
  account(id: "001") {
    name
  }
}

# ---------------------------------------------------
# 2. Multiple Arguments
# ---------------------------------------------------

query {
  users(
    department: "Sales"
    active: true
  ) {
    id
    name
    email
  }
}

# ---------------------------------------------------
# 3. Using Variables
# ---------------------------------------------------

query GetAccount($id: ID!) {
  account(id: $id) {
    id
    name
    industry
  }
}

# Variables
#
# {
#   "id": "001"
# }

# ---------------------------------------------------
# 4. Variable with Default Value
# ---------------------------------------------------

query GetAccount($id: ID = "001") {
  account(id: $id) {
    name
  }
}

# ---------------------------------------------------
# 5. Nested Field Arguments
# ---------------------------------------------------

query {
  account(id: "001") {
    name

    contacts(limit: 5) {
      firstName
      lastName
      email
    }
  }
}

# ---------------------------------------------------
# 6. Pagination
# ---------------------------------------------------

query {
  accounts(first: 10) {
    edges {
      node {
        id
        name
      }
    }
  }
}

# ---------------------------------------------------
# 7. Cursor Pagination
# ---------------------------------------------------

query {
  accounts(
    first: 10
    after: "cursor123"
  ) {
    edges {
      node {
        id
        name
      }
    }
  }
}

# ---------------------------------------------------
# 8. Sorting
# ---------------------------------------------------

query {
  accounts(
    orderBy: NAME
    direction: ASC
  ) {
    id
    name
  }
}

# ---------------------------------------------------
# 9. Filtering
# ---------------------------------------------------

query {
  products(
    category: "Laptop"
    available: true
  ) {
    name
    price
  }
}

# ---------------------------------------------------
# 10. Search
# ---------------------------------------------------

query {
  search(keyword: "GraphQL") {
    title
    description
  }
}

# ---------------------------------------------------
# 11. List Argument
# ---------------------------------------------------

query {
  users(ids: ["101", "102", "103"]) {
    id
    name
  }
}

# ---------------------------------------------------
# 12. Input Object
# ---------------------------------------------------

query {
  users(
    filter: {
      department: "Engineering"
      active: true
    }
  ) {
    id
    name
    email
  }
}

# ---------------------------------------------------
# 13. Salesforce Example
# ---------------------------------------------------

query GetAccount($id: ID!) {
  account(id: $id) {
    id
    name
    industry

    contacts(first: 5) {
      firstName
      lastName
      email
    }
  }
}

# Variables
#
# {
#   "id": "001XXXXXXXXXXXX"
# }
